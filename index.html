<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Команда</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0;--sf:#fff;--sf2:#F0EDE8;
  --bd:rgba(0,0,0,.08);--bdm:rgba(0,0,0,.14);
  --tx:#1A1814;--tx2:#6B6660;--tx3:#9E9994;
  --gr:#2D6A4F;--grdk:#1B4332;--grbg:#E8F4EE;
  --r:14px;--rs:8px;
  --sh:0 2px 12px rgba(0,0,0,.06);--shlg:0 8px 40px rgba(0,0,0,.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:rgba(247,245,240,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);height:52px;display:flex;align-items:center;padding:0 16px;gap:12px}
.logo{font-family:'Fraunces',serif;font-size:18px;font-weight:500;color:var(--tx);letter-spacing:-.02em;white-space:nowrap}
.logo span{color:var(--gr)}
.hdr-tabs{display:flex;gap:4px}
.htab{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--bdm);background:transparent;color:var(--tx2);cursor:pointer;transition:all .15s;white-space:nowrap;font-family:'DM Sans',sans-serif}
.htab.on{background:var(--gr);color:#fff;border-color:var(--gr)}
.hdr-r{margin-left:auto;font-size:11px;color:var(--tx3);white-space:nowrap}

/* MAIN */
.main{max-width:1280px;margin:0 auto;padding:16px 14px 80px}
.pane{display:none}.pane.on{display:block}

/* SEARCH */
.srow{position:relative;margin-bottom:10px}
.srow input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--bdm);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--sf);color:var(--tx);outline:none;box-shadow:var(--sh);-webkit-appearance:none}
.srow input:focus{border-color:var(--gr)}
.sico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--tx3);pointer-events:none}

/* ACTIVE FILTERS */
.af{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.afc{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--grbg);color:var(--grdk);border:1px solid rgba(45,106,79,.2);cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:4px}
.afc::after{content:'×';font-size:12px;opacity:.7}

/* FILTER GROUPS */
.fw{margin-bottom:16px}
.ftog{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--sf);border:1px solid var(--bdm);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:13px;color:var(--tx2);cursor:pointer;box-shadow:var(--sh);margin-bottom:6px}
.ftog .arr{font-size:10px;transition:transform .2s}
.ftog.on .arr{transform:rotate(180deg)}
.fbody{display:none;padding:8px 0 4px}
.fbody.on{display:block}
.frow{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.flbl{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);white-space:nowrap;min-width:72px;padding-top:7px}
.fbw{display:flex;flex-wrap:wrap;gap:5px}
.fb{font-family:'DM Sans',sans-serif;font-size:11px;padding:5px 11px;border-radius:40px;border:1px solid var(--bdm);background:var(--sf);color:var(--tx2);cursor:pointer;transition:all .15s;white-space:nowrap}
.fb:hover{border-color:var(--gr);color:var(--gr)}
.fb.on{background:var(--gr);color:#fff;border-color:var(--gr)}
.fb.fvac{border-color:#E4A030;color:#8A4F00}.fb.fvac.on{background:#E4A030;border-color:#E4A030;color:#fff}
.fb.fsick{border-color:#D85A5A;color:#8B2020}.fb.fsick.on{background:#D85A5A;border-color:#D85A5A;color:#fff}
.fb.fin{border-color:var(--gr);color:var(--gr)}.fb.fin.on{background:var(--gr);color:#fff}
.fb.frem{border-color:#9E9994;color:#6B6660}.fb.frem.on{background:#6B6660;border-color:#6B6660;color:#fff}

/* SECTION LABEL */
.slbl{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.slbl::after{content:'';flex:1;height:1px;background:var(--bd)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:4px}

/* REGULAR CARD */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s;animation:fu .25s ease both;-webkit-tap-highlight-color:transparent}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card:active{transform:scale(.98)}
.card.evbday{border-color:#F0997B}.card.evjd{border-color:#E4A030}
.card.evjw{border-color:#8B72C8}.card.evboth{border-color:#2D9970}
.crib{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rb{font-size:9px;font-weight:500;padding:2px 6px;border-radius:20px;white-space:nowrap;line-height:1.5}
.rbbday{background:#FAECE7;color:#993C1D}.rbjd{background:#FEF3DC;color:#8A4F00}
.rbjw{background:#EEE9F8;color:#3D2E6B}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:15px;font-weight:500;margin-bottom:10px;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cn{font-size:12px;font-weight:500;color:var(--tx);margin-bottom:2px;line-height:1.3}
.cr{font-size:10px;color:var(--tx2);margin-bottom:6px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.chip{font-size:9px;padding:2px 7px;border-radius:20px;white-space:nowrap}
.chco{} /* company color applied inline */
.choff{background:#F0EDE8;color:#5A5550;border:1px solid rgba(0,0,0,.08)}
.chin{background:#E8F4EE;color:#1B4332;border:1px solid rgba(45,106,79,.2)}
.bw .bl{font-size:10px;color:var(--tx3);margin-bottom:4px}
.bt{height:3px;background:var(--sf2);border-radius:2px;overflow:hidden}
.bf{height:100%;border-radius:2px;background:var(--gr)}

/* ABSENT CARD */
.card-abs{border:none!important;padding:0!important;overflow:hidden;box-shadow:var(--sh);cursor:pointer;border-radius:var(--r);animation:fu .25s ease both;-webkit-tap-highlight-color:transparent;transition:box-shadow .18s}
.card-abs:active{transform:scale(.98)}
.card-abs-vac{box-shadow:0 0 0 2px #F5A623,var(--shlg)!important}
.card-abs-sick{box-shadow:0 0 0 2px #D85A5A,var(--shlg)!important}
.ach{display:flex;align-items:center;gap:9px;padding:9px 13px 7px}
.ach-vac{background:linear-gradient(135deg,#FEF3DC,#FDE9B0)}
.ach-sick{background:linear-gradient(135deg,#FCE8E8,#F8C4C4)}
.ach-ico{font-size:18px;line-height:1}
.ach-lbl{font-size:11px;font-weight:500}
.ach-vac .ach-lbl{color:#7C4A00}
.ach-sick .ach-lbl{color:#7A1D1D}
.ach-until{font-size:10px}
.ach-vac .ach-until{color:#A06000}
.ach-sick .ach-until{color:#A03030}
.acb{display:flex;align-items:center;gap:9px;padding:9px 13px 6px;background:var(--sf)}
.acb .av{margin-bottom:0}
.acsub{font-size:10px;color:var(--tx3);padding:5px 13px 9px;background:var(--sf);border-top:1px solid var(--bd)}

/* PAGINATION */
.pag{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:20px;flex-wrap:wrap}
.pb{font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 12px;border-radius:40px;border:1px solid var(--bdm);background:var(--sf);color:var(--tx2);cursor:pointer;transition:all .15s}
.pb.on{background:var(--gr);color:#fff;border-color:var(--gr)}
.pb:disabled{opacity:.4;cursor:default}
.pi{font-size:11px;color:var(--tx3)}

/* OVERLAY & MODAL */
.ov{position:fixed;inset:0;background:rgba(20,16,10,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .22s}
.ov.on{opacity:1;pointer-events:all}
.modal{background:var(--sf);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;transform:translateY(30px);transition:transform .25s cubic-bezier(.32,.72,0,1);position:relative}
.ov.on .modal{transform:translateY(0)}
@media(min-width:640px){.ov{align-items:center}.modal{border-radius:20px;max-height:88vh;margin:20px}}
.drag{width:36px;height:4px;background:var(--bdm);border-radius:2px;margin:12px auto 0}
.mi{padding:18px 18px 24px}
.mh{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.mav-w{position:relative;flex-shrink:0}
.mav{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px;font-weight:500;overflow:hidden;cursor:pointer;position:relative}
.mav img{width:100%;height:100%;object-fit:cover}
.mav-hint{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;font-size:10px;color:#fff;text-align:center;line-height:1.3;font-family:'DM Sans',sans-serif}
.mav:hover .mav-hint{display:flex}
.mav-dot{position:absolute;bottom:0;right:0;width:17px;height:17px;border-radius:50%;border:2px solid var(--sf);display:flex;align-items:center;justify-content:center;font-size:9px}
.mav-dot.vacation{background:#F5A623}.mav-dot.sick{background:#D85A5A}
.mn{font-family:'Fraunces',serif;font-size:17px;font-weight:500;line-height:1.2;color:var(--tx)}
.mrole{font-size:12px;color:var(--tx2);margin:3px 0 8px}
.xbtn{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--bdm);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx2)}

/* MODAL TABS */
.mtabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:16px}
.mtab{font-size:13px;padding:8px 14px;border:none;background:transparent;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;font-family:'DM Sans',sans-serif}
.mtab.on{color:var(--gr);border-bottom-color:var(--gr);font-weight:500}

/* BANNERS */
.bnr{border-radius:var(--rs);padding:9px 12px;margin-bottom:8px;font-size:12px}
.bnrbday{background:#FAECE7;color:#993C1D}
.bnrjd{background:#FEF3DC;color:#8A4F00}
.bnrjw{background:#EEE9F8;color:#3D2E6B}

/* ABSENCE BLOCK in modal */
.abblk{border-radius:var(--rs);padding:12px 14px;margin-bottom:14px;border:1px solid var(--bd)}
.abblk.vacation{background:#FFFBF0;border-left:3px solid #F5A623}
.abblk.sick{background:#FFF5F5;border-left:3px solid #D85A5A}
.abtitle{font-size:12px;font-weight:500;color:var(--tx);margin-bottom:6px}
.abrow{font-size:12px;color:var(--tx2);margin-bottom:4px;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.abrow b{color:var(--tx)}
.alink{color:var(--gr);text-decoration:none;font-weight:500}
.alink:hover{text-decoration:underline}
.pencil{font-size:11px;color:var(--tx3);cursor:pointer;margin-left:4px;opacity:.7;vertical-align:middle}
.pencil:hover{opacity:1;color:var(--gr)}
/* sub edit */
.subedit{display:none;margin-top:6px}
.subedit.on{display:block}
.subrow{display:flex;gap:5px;margin-bottom:5px;align-items:center}
.subrow input{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--bdm);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;background:var(--sf);color:var(--tx);outline:none;-webkit-appearance:none}
.subrow input:focus{border-color:var(--gr)}
.btn-xs{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--bdm);background:transparent;color:var(--tx2);cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}
.btn-xs.save{background:var(--gr);color:#fff;border-color:var(--gr)}
.btn-xs.rm{border-color:transparent;color:var(--tx3)}
.btn-xs.rm:hover{color:#D85A5A}
.subedit-btns{display:flex;gap:6px;margin-top:4px}

/* PRESENCE */
.presbar{display:flex;align-items:center;gap:8px;background:var(--sf2);border-radius:var(--rs);padding:9px 12px;margin-bottom:14px;border:1px solid var(--bd)}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pdot.in{background:var(--gr);box-shadow:0 0 0 3px rgba(45,106,79,.18)}
.pdot.out{background:var(--tx3)}
.ptxt{font-size:12px;color:var(--tx2);flex:1}
.pip{font-size:10px;color:var(--tx3);font-family:monospace}

/* INFO GRID */
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:14px}
.il{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:3px}
.iv{font-size:13px;font-weight:500;color:var(--tx)}
.full{grid-column:1/-1}

/* CONTACTS */
.cb{margin-bottom:14px}
.cbh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cblbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3)}
.ebtn{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--bdm);background:var(--sf);color:var(--gr);cursor:pointer;font-family:'DM Sans',sans-serif}
.crow{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.crow:last-child{border:none}
.cic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:500}
.cph{background:#E1F5EE}.cint{background:#E8F4EE}.ctg{background:#E6F1FB}
.cvk{background:#E8EFFE}.cem{background:#EEEDFE}.cdept{background:#EEE9F8}.coff{background:#F0EDE8}
.ct{font-size:12px;color:var(--tx);min-width:0}
.ct a{color:var(--gr);text-decoration:none;word-break:break-all}
.ctlbl{font-size:10px;color:var(--tx3);margin-bottom:1px}
.ctval{font-size:12px;color:var(--tx);word-break:break-all}
.aliaslist{margin-top:2px}
.aliasitem{font-size:11px;color:var(--tx2)}
/* edit form */
.ef{display:none}.ef.on{display:block}
.efg{margin-bottom:12px}
.eflbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:5px}
.efinp{width:100%;padding:8px 10px;border:1px solid var(--bdm);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;background:var(--sf);color:var(--tx);outline:none;-webkit-appearance:none}
.efinp:focus{border-color:var(--gr)}
.efrow{display:flex;gap:5px;margin-bottom:5px}
.efrow .efinp{flex:1;min-width:0}
.efrm{width:26px;height:26px;border-radius:50%;border:1px solid var(--bdm);background:transparent;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.efadd{font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--bdm);background:transparent;color:var(--tx2);cursor:pointer;font-family:'DM Sans',sans-serif}
.efbtns{display:flex;gap:8px;margin-top:8px}
.efsave{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 18px;border-radius:40px;border:none;background:var(--gr);color:#fff;cursor:pointer;flex:1}
.efcancel{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 14px;border-radius:40px;border:1px solid var(--bdm);background:transparent;color:var(--tx2);cursor:pointer}

/* HOBBIES */
.hb{margin-bottom:16px}
.hbh{display:flex;align-items:center;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tg{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--grbg);color:var(--grdk);border:1px solid rgba(45,106,79,.2);display:inline-flex;align-items:center;gap:5px}
.tgx{cursor:pointer;opacity:.6;font-size:13px;font-weight:500;line-height:1}
.tgx:hover{opacity:1}
/* cloud */
.hpicker{margin-top:10px}
.hplbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:6px}
.hpsrow{position:relative;margin-bottom:8px}
.hpsinp{width:100%;padding:7px 30px 7px 10px;border:1px solid var(--bdm);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;background:var(--sf);color:var(--tx);outline:none;-webkit-appearance:none}
.hpsinp:focus{border-color:var(--gr)}
.hpsclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:13px;padding:2px;line-height:1;display:none}
.hcloud{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.hct{font-size:11px;padding:4px 11px;border-radius:20px;background:var(--sf2);color:var(--tx2);border:1px solid var(--bd);cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none}
.hct:hover{border-color:var(--gr);color:var(--gr);background:var(--grbg)}
.hct.used{opacity:.35;cursor:default;pointer-events:none}
.hct.hidden{display:none}
.hcdiv{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em}
.hcdiv::before,.hcdiv::after{content:'';flex:1;height:1px;background:var(--bd)}
.harow{display:flex;gap:6px}
.harow input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--bdm);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;background:var(--sf);color:var(--tx);outline:none;-webkit-appearance:none}
.harow input:focus{border-color:var(--gr)}
.habtn{font-size:12px;padding:7px 14px;border-radius:40px;border:none;background:var(--gr);color:#fff;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}
.hcempty{font-size:11px;color:var(--tx3);padding:4px 0}

/* ACTIONS */
.macts{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{font-family:'DM Sans',sans-serif;font-size:12px;padding:9px 14px;border-radius:40px;border:1px solid var(--bdm);background:var(--bg);color:var(--tx2);cursor:pointer;flex:1;min-width:120px;text-align:center}
.mbtn.pr{background:var(--gr);color:#fff;border-color:var(--gr)}

/* ANALYTICS */
.an-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.ansc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh)}
.ansn{font-family:'Fraunces',serif;font-size:34px;font-weight:300;line-height:1;margin-bottom:3px}
.ansl{font-size:11px;color:var(--tx3)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.cctitle{font-family:'Fraunces',serif;font-size:15px;font-weight:500;color:var(--tx);margin-bottom:3px}
.ccsub{font-size:11px;color:var(--tx3);margin-bottom:16px}
.csvg{width:100%;overflow:visible;display:block}

/* COMPANY COLORS */
.co0{background:#E6F1FB;color:#0C447C}.co1{background:#EEE9F8;color:#3D2E6B}
.co2{background:#E1F5EE;color:#0F6E56}.co3{background:#FAECE7;color:#993C1D}
.co4{background:#FEF3DC;color:#8A4F00}.co5{background:#EAF3DE;color:#3B6D11}
.co6{background:#FBEAF0;color:#993556}.co7{background:#FCE8E8;color:#8B2020}
.co8{background:#E8F0FE;color:#1A4080}

.empty{text-align:center;padding:50px 20px;color:var(--tx3);font-size:14px}

@media(max-width:500px){
  .an-top{grid-template-columns:1fr 1fr}
  .charts{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .macts{flex-direction:column}.mbtn{min-width:unset}
  .ig{grid-template-columns:1fr 1fr}
  .hdr-r{display:none}
}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
@media(min-width:768px){

<body>

<header class="hdr">
  <div class="logo">people<span>.</span></div>
  <div class="hdr-tabs">
    <button class="htab on" onclick="switchTab('people')">Сотрудники</button>

  </div>

<main class="main">

<!-- PEOPLE TAB -->
<div class="pane on" id="pane-people">

    <svg class="sico" fill="none" stroke="currentColor" viewBox="0 0 24 24">

      <div class="frow"><span class="flbl">Офис</span><div class="fbw" id="f-off"></div></div>
      <div class="frow"><span class="flbl">Отдел</span><div class="fbw" id="f-dept"></div></div>
      <div class="frow"><span class="flbl">Статус</span><div class="fbw" id="f-abs"></div></div>

            <button id="f-hob-clear" onclick="clearHobSearch()" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:13px;padding:2px;line-height:1">✕</button>
          </div>
          <div class="fbw" id="f-hob" style="max-height:90px;overflow-y:auto"></div>
        </div>

  <div id="content"></div>

</div>

<!-- CHARTS TAB -->

    <div class="ansc"><div class="ansn" id="an-total">200</div><div class="ansl">сотрудников всего</div></div>

    <div class="cc"><div class="cctitle">Средний возраст</div><div class="ccsub">С 1997 года</div><svg class="csvg" id="svg-age" viewBox="0 0 480 200"></svg></div>
    <div class="cc" style="grid-column:1/-1"><div class="cctitle">Средний стаж</div><div class="ccsub">Средний стаж сотрудников (лет) с 1997 года</div><svg class="csvg" id="svg-tenure" viewBox="0 0 960 200"></svg></div>
  </div>

</main>

<!-- MODAL -->

<datalist id="empnames"></datalist>

<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────
var COS=['ТКТЕЛ','ЦЕНТР','Регион','МТС','Сантел','Файбер коннект','УК ПФ','Блицтелеком','Квиклайн'];
var OFFS=['Микояна','Электрозаводская','Красногорск','Элиста'];
var DEPTS=['Разработка','Маркетинг','HR','Финансы','Продажи','Дизайн','Техподдержка','Бухгалтерия','Юридический','Операции'];
var ROLES=['Руководитель отдела','Старший специалист','Специалист','Менеджер','Аналитик','Инженер','Координатор','Эксперт','Ведущий специалист','Младший специалист','Team Lead','Бизнес-аналитик','Системный администратор','Директор по развитию','Технический директор'];
var HPOOL=['Горные лыжи','Фотография','Велоспорт','Игры','Кулинария','Йога','Путешествия','Бег','Книги','Теннис','Рисование','Шахматы','Хайкинг','Танцы','Театр','Скетчинг','Кино','Музыка','Садоводство','Рыбалка','Мотоциклы','Гольф','Плавание','Подкасты','SMM','Психология','Open Source','3D-печать','Гитара','Скалолазание'];
var FIRSTS=['Анна','Дмитрий','Мария','Сергей','Екатерина','Алексей','Ольга','Никита','Виктория','Артём','Наталья','Павел','Ирина','Роман','Елена','Максим','Юлия','Андрей','Татьяна','Иван','Светлана','Кирилл','Людмила','Денис','Нина','Евгений','Валентина','Михаил','Галина','Станислав','Оксана','Владимир','Лариса','Антон','Надежда','Константин','Вера','Тимур','Зоя','Руслан'];
var LASTS=['Петрова','Козлов','Иванова','Новиков','Смирнова','Волков','Кузнецова','Попов','Соколова','Михайлов','Борисова','Громов','Семёнова','Захаров','Фёдорова','Орлов','Морозова','Лебедев','Павлова','Никитин','Соловьёв','Тихонова','Медведев','Степанова','Васильев','Белова','Зайцев','Миронова','Чернов','Голубева','Виноградов','Богданова','Матвеева','Фролов','Давыдова','Гусев','Макарова','Сидоров','Егорова','Климова'];
var OIPS={'Микояна':['192.168.10.','192.168.11.'],'Электрозаводская':['192.168.20.','192.168.21.'],'Красногорск':['192.168.30.','192.168.31.'],'Элиста':['192.168.40.','192.168.41.']};

// ─── SEEDED RNG ───────────────────────────────────────────────────────────
function mkRng(s){return function(){s=(s*1664525+1013904223)>>>0;return s/0x100000000}}
var rng=mkRng(42);

function p2(n){return n<10?'0'+n:''+n}
function rDate(y1,y2){var y=y1+Math.floor(rng()*(y2-y1+1)),m=1+Math.floor(rng()*12),d=1+Math.floor(rng()*27);return y+'-'+p2(m)+'-'+p2(d)}
function rFut(mn,mx,r){var d=new Date();d.setDate(d.getDate()+mn+Math.floor((r||rng)()*(mx-mn)));return d.toISOString().slice(0,10)}
function dDate(days,yb){var d=new Date();d.setDate(d.getDate()+days);return (d.getFullYear()-yb)+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b}

// ─── GENERATE EMPLOYEES ───────────────────────────────────────────────────
var EMP=[];
for(var i=1;i<=200;i++){
  var fn=FIRSTS[(i-1)%FIRSTS.length],ln=LASTS[(i-1)%LASTS.length];
  var co=COS[Math.floor((i-1)*COS.length/200)];
  var off=OFFS[Math.floor((i-1)*OFFS.length/200)];
  var dept=DEPTS[(i-1)%DEPTS.length];
  var role=ROLES[(i-1)%ROLES.length];
  var tgl=fn.toLowerCase().replace(/[ёе]/g,'e').replace(/[^a-z]/gi,'');
  var lnl=ln.toLowerCase().replace(/[ёе]/g,'e').replace(/[^a-z]/gi,'').slice(0,5);
  var ph=['+7 '+String(900+Math.floor(rng()*99))+' '+String(100+Math.floor(rng()*899))+'-'+p2(10+Math.floor(rng()*89))+'-'+p2(10+Math.floor(rng()*89))];
  if(i%6===0)ph.push('+7 '+String(900+Math.floor(rng()*99))+' '+String(100+Math.floor(rng()*899))+'-'+p2(10+Math.floor(rng()*89))+'-'+p2(10+Math.floor(rng()*89)));
  var ints=[String(100+i)];if(i%4===0)ints.push(String(600+i));
  var vk=i%5!==0?'vk.com/'+tgl+String(Math.floor(rng()*999)):'';
  var email=fn[0].toLowerCase()+'.'+lnl+'@company.ru';
  var aliases=[];
  if(i%3===0)aliases.push(ln.toLowerCase().replace(/[ёе]/g,'e').replace(/[^a-z]/gi,'')+'@company.ru');
  if(i%7===0)aliases.push(tgl+'.'+lnl+'@company.ru');
  var hobbies=shuf(HPOOL).slice(0,2+Math.floor(rng()*3));
  var born=rDate(1974,2000),joined=rDate(2010,2024);
  var mgr=i>1?FIRSTS[(i+3)%FIRSTS.length]+' '+LASTS[(i+7)%LASTS.length]:'—';
  var absence=null;
  if(i%7===0){var sf=FIRSTS[(i+5)%FIRSTS.length],sl=LASTS[(i+9)%LASTS.length];absence={type:'vacation',until:rFut(2,21),subs:[sf+' '+sl]};}
  else if(i%13===0){var sf2=FIRSTS[(i+2)%FIRSTS.length],sl2=LASTS[(i+4)%LASTS.length];absence={type:'sick',until:rFut(1,10),subs:[sf2+' '+sl2]};}
  var oranges=OIPS[off]||[];
  var lip=null;
  if(oranges.length&&i%3===0&&!absence)lip=oranges[0]+String(10+Math.floor(rng()*200));
  EMP.push({id:i,name:fn+' '+ln,co:co,coIdx:COS.indexOf(co),off:off,dept:dept,role:role,born:born,joined:joined,mgr:mgr,phones:ph,ints:ints,tg:'@'+tgl+'_'+lnl,vk:vk,email:email,aliases:aliases,hobbies:hobbies,absence:absence,lip:lip});
}

// Demo events
EMP[0].born=dDate(1,45);EMP[0].name='Ирина Семёнова';EMP[0].co='ТКТЕЛ';EMP[0].coIdx=0;EMP[0].off='Микояна';
EMP[1].joined=dDate(3,10);EMP[1].name='Роман Захаров';EMP[1].co='ЦЕНТР';EMP[1].coIdx=1;EMP[1].off='Электрозаводская';
EMP[2].born=dDate(5,30);EMP[2].name='Анна Петрова';EMP[2].co='МТС';EMP[2].coIdx=3;EMP[2].off='Красногорск';
EMP[3].born=dDate(2,0);EMP[3].joined=dDate(2,5);EMP[3].name='Дмитрий Козлов';EMP[3].co='Квиклайн';EMP[3].coIdx=8;EMP[3].off='Элиста';
EMP[4].born=dDate(0,50);EMP[4].name='Сергей Новиков';EMP[4].co='Сантел';EMP[4].coIdx=4;EMP[4].off='Микояна';
EMP[5].joined=dDate(6,15);EMP[5].name='Мария Иванова';EMP[5].co='Файбер коннект';EMP[5].coIdx=5;EMP[5].off='Красногорск';
EMP[10].absence={type:'vacation',until:rFut(3,14,mkRng(99)),subs:['Ольга Кузнецова','Максим Орлов']};EMP[10].name='Виктория Соколова';EMP[10].lip=null;
EMP[20].absence={type:'sick',until:rFut(1,7,mkRng(77)),subs:['Павел Громов']};EMP[20].name='Алексей Волков';EMP[20].lip=null;

// Build datalist
(function(){var dl=document.getElementById('empnames');EMP.forEach(function(e){var op=document.createElement('option');op.value=e.name;dl.appendChild(op)})})();

// ─── STATE ────────────────────────────────────────────────────────────────
var cEdits={};   // contact edits per id
var hEdits={};   // hobby edits per id
var aEdits={};   // absence edits per id (subs override)
var pStore={};   // photo store
var upId=null;
var fCo='Все',fOff='Все',fDept='Все',fAbs='Все',fPres='Все',fHob='Все';
var pg=1,PER=30;
var mTab='info';
var chartsDrawn=false;

// ─── HELPERS ──────────────────────────────────────────────────────────────
var msY=365.25*24*3600*1000;
function yAt(d){return (Date.now()-new Date(d))/msY}
function fmtY(y){var n=Math.floor(y);return n+(n===1?' год':n<5?' года':' лет')}
function fmtD(s,o){try{return new Date(s).toLocaleDateString('ru-RU',o)}catch(x){return s}}
function fmtU(s){return fmtD(s,{day:'numeric',month:'long'})}
function ini(n){return n.split(' ').map(function(w){return w[0]}).join('').slice(0,2)}
function acol(idx){return idx%9}
function inOff(e){var r=OIPS[e.off]||[];return r.some(function(x){return e.lip&&e.lip.indexOf(x)===0})}
function getSubs(e){return (aEdits[e.id]&&aEdits[e.id].subs!==undefined)?aEdits[e.id].subs:(e.absence?e.absence.subs||[]:[]) }
function getCt(e){return cEdits[e.id]||{phones:e.phones.slice(),ints:e.ints.slice(),tg:e.tg,vk:e.vk,email:e.email,aliases:e.aliases.slice()}}
function getHobbies(e){return hEdits[e.id]?hEdits[e.id]:e.hobbies.slice()}
function allHobbies(){var s={};EMP.forEach(function(e){getHobbies(e).forEach(function(h){s[h]=1})});HPOOL.forEach(function(h){s[h]=1});return Object.keys(s).sort(function(a,b){return a.localeCompare(b,'ru')})}
function empByName(n){return EMP.find(function(x){return x.name===n})}
function dlbl(d){return d===0?'Сегодня':d===1?'Завтра':'Через '+d+' дн.'}

function daysU(s){
  var now=new Date();now.setHours(0,0,0,0);
  var d=new Date(s);var nx=new Date(now.getFullYear(),d.getMonth(),d.getDate());
  if(nx<now)nx.setFullYear(now.getFullYear()+1);
  return Math.round((nx-now)/86400000);
}
function evOf(e){
  var bD=daysU(e.born),bs=bD<=7;
  var age=Math.floor(yAt(e.born)),ta=age+(bD===0?0:1);
  var jd=bs&&ta%5===0?ta:null;
  var jn=new Date(e.joined),now=new Date();now.setHours(0,0,0,0);
  var nx=new Date(now.getFullYear(),jn.getMonth(),jn.getDate());
  if(nx<now)nx.setFullYear(now.getFullYear()+1);
  var aD=Math.round((nx-now)/86400000),yrs=Math.round(yAt(e.joined));
  var jw=aD<=7&&[1,2,3,5,7,10,15,20,25,30].indexOf(yrs)>=0?{d:aD,y:yrs}:null;
  return {bD:bD,bs:bs,jd:jd,jw:jw};
}
function hasEv(e){var v=evOf(e);return v.bs||!!v.jw}

// ─── FILTER & SORT ────────────────────────────────────────────────────────
function filtered(){
  var q=document.getElementById('search').value.toLowerCase().trim();
  return EMP.filter(function(e){
    if(fCo!=='Все'&&e.co!==fCo)return false;
    if(fOff!=='Все'&&e.off!==fOff)return false;
    if(fDept!=='Все'&&e.dept!==fDept)return false;
    if(fAbs==='vacation'&&(!e.absence||e.absence.type!=='vacation'))return false;
    if(fAbs==='sick'&&(!e.absence||e.absence.type!=='sick'))return false;
    if(fAbs==='absent'&&!e.absence)return false;
    if(fHob!=='Все'&&getHobbies(e).indexOf(fHob)<0)return false;
    if(!q)return true;
    var ct=getCt(e);
    var srch=[e.name,e.role,e.dept,e.co,e.off,ct.tg,ct.vk,ct.email,getHobbies(e).join(' '),e.absence?(getSubs(e).join(' ')+' '+e.absence.type):''];
    return srch.some(function(s){return s&&s.toLowerCase().indexOf(q)>=0});
  });
}
function sorted(list){
  return list.slice().sort(function(a,b){
    var ea=evOf(a),eb=evOf(b);
    var ah=ea.bs||!!ea.jw,bh=eb.bs||!!eb.jw;
    if(ah&&!bh)return -1;if(!ah&&bh)return 1;
    if(ah&&bh)return Math.min(ea.bD,ea.jw?ea.jw.d:999)-Math.min(eb.bD,eb.jw?eb.jw.d:999);
    return a.name.localeCompare(b.name,'ru');
  });
}

// ─── AVATAR HTML ──────────────────────────────────────────────────────────
function avH(e,sz,fs){
  var ci=acol(e.coIdx);
  var p=pStore[e.id];
  var css='width:'+sz+'px;height:'+sz+'px;';
  if(p)return '<div class="av" style="'+css+'"><img src="'+p+'" alt=""></div>';
  var cols=[['#E6F1FB','#0C447C'],['#EEE9F8','#3D2E6B'],['#E1F5EE','#0F6E56'],['#FAECE7','#993C1D'],['#FEF3DC','#8A4F00'],['#EAF3DE','#3B6D11'],['#FBEAF0','#993556'],['#FCE8E8','#8B2020'],['#E8F0FE','#1A4080']];
  var c=cols[ci%cols.length];
  return '<div class="av" style="'+css+'background:'+c[0]+';color:'+c[1]+';font-size:'+fs+'px">'+ini(e.name)+'</div>';
}

// ─── CARD HTML ────────────────────────────────────────────────────────────
function cardH(e){
  var ev=evOf(e);
  var rbs='';
  if(ev.jd&&ev.jw)rbs='<span class="rb rbjd">юбилей '+ev.jd+' лет</span><span class="rb rbjw">с нами '+ev.jw.y+' лет</span>';
  else if(ev.jd)rbs='<span class="rb rbjd">юбилей '+ev.jd+' лет — '+dlbl(ev.bD)+'</span>';
  else if(ev.jw)rbs='<span class="rb rbjw">с нами '+ev.jw.y+' лет — '+dlbl(ev.jw.d)+'</span>';
  else if(ev.bs)rbs='<span class="rb rbbday">ДР — '+dlbl(ev.bD)+'</span>';

  if(e.absence){
    var isV=e.absence.type==='vacation';
    var subs=getSubs(e);
    return '<div class="card-abs card-abs-'+(isV?'vac':'sick')+'" onclick="openModal('+e.id+')">'+
      '<div class="ach ach-'+(isV?'vac':'sick')+'">'+
        '<span class="ach-ico">'+(isV?'✈':'🤒')+'</span>'+
        '<div><div class="ach-lbl">'+(isV?'В отпуске':'На больничном')+'</div>'+
        '<div class="ach-until">до '+fmtU(e.absence.until)+'</div></div>'+
      '</div>'+
      '<div class="acb">'+avH(e,40,14)+
        '<div><div class="cn">'+e.name+'</div><div class="cr">'+e.role+'</div>'+
        '<div class="chips"><span class="chip co'+e.coIdx+'">'+e.co+'</span><span class="chip choff">'+e.off+'</span></div></div>'+
      '</div>'+
      '<div class="acsub">Замещает: '+(subs.length?subs.join(', '):'не назначен')+'</div>'+
    '</div>';
  }

  var y=yAt(e.joined),pct=Math.min(100,Math.round(y/20*100));
  var ecls='';
  if(ev.jd&&ev.jw)ecls='evboth';else if(ev.jd)ecls='evjd';else if(ev.jw)ecls='evjw';else if(ev.bs)ecls='evbday';
  var inch=inOff(e)?'<span class="chip chin">в офисе</span>':'';
  return '<div class="card'+(ecls?' '+ecls:'')+'" onclick="openModal('+e.id+')">'+
    '<div class="crib">'+rbs+'</div>'+
    avH(e,44,15)+
    '<div class="cn">'+e.name+'</div>'+
    '<div class="cr">'+e.role+'</div>'+
    '<div class="chips"><span class="chip co'+e.coIdx+'">'+e.co+'</span><span class="chip choff">'+e.off+'</span>'+inch+'</div>'+
    '<div class="bw"><div class="bl">'+e.dept+' · '+fmtY(y)+'</div><div class="bt"><div class="bf" style="width:'+pct+'%"></div></div></div>'+
  '</div>';
}

// ─── RENDER MAIN ─────────────────────────────────────────────────────────
function renderAll(){
  try{
    var all=sorted(filtered());
    var wev=all.filter(hasEv),rest=all.filter(function(e){return !hasEv(e)});
    var totPg=Math.ceil(rest.length/PER)||1;
    if(pg>totPg)pg=totPg;
    var items=rest.slice((pg-1)*PER,pg*PER);
    var html='';
    if(wev.length)html+='<div class="slbl">Ближайшие события (7 дней)</div><div class="grid">'+wev.map(cardH).join('')+'</div>';
    if(rest.length){if(wev.length)html+='<div class="slbl">Вся команда</div>';html+='<div class="grid">'+items.map(cardH).join('')+'</div>';}
    if(!all.length)html='<div class="empty">Никого не найдено</div>';
    document.getElementById('content').innerHTML=html;
    var n=all.length;
    document.getElementById('hdr-r').textContent=n+' '+(n===1?'сотрудник':n<5?'сотрудника':'сотрудников');
    renderPag(totPg,rest.length);
    renderAF();
  }catch(err){console.error(err)}
}

function renderPag(tot,cnt){
  var p=document.getElementById('pag');
  if(tot<=1){p.innerHTML='';return}
  var h='<button class="pb" onclick="goP('+(pg-1)+')" '+(pg===1?'disabled':'')+'>←</button>';
  for(var i=1;i<=tot;i++){
    if(i===1||i===tot||Math.abs(i-pg)<=2)h+='<button class="pb'+(i===pg?' on':'')+'" onclick="goP('+i+')">'+i+'</button>';
    else if(Math.abs(i-pg)===3)h+='<span class="pi">…</span>';
  }
  h+='<button class="pb" onclick="goP('+(pg+1)+')" '+(pg===tot?'disabled':'')+'>→</button>';
  h+='<span class="pi">'+((pg-1)*PER+1)+'–'+Math.min(pg*PER,cnt)+' из '+cnt+'</span>';
  p.innerHTML=h;
}

function mkFb(txt,isOn,ecls,fn){var b=document.createElement('button');b.className='fb'+(isOn?' on':'')+(ecls?' '+ecls:'');b.textContent=txt;b.onclick=fn;return b}

function buildF(){
  var w;
  w=document.getElementById('f-co');w.innerHTML='';
  ['Все'].concat(COS).forEach(function(v){w.appendChild(mkFb(v,v===fCo,'',function(val){return function(){fCo=val;pg=1;buildF();renderAll()}}(v)))});
  w=document.getElementById('f-off');w.innerHTML='';
  ['Все'].concat(OFFS).forEach(function(v){w.appendChild(mkFb(v,v===fOff,'',function(val){return function(){fOff=val;pg=1;buildF();renderAll()}}(v)))});
  w=document.getElementById('f-dept');w.innerHTML='';
  ['Все'].concat(DEPTS).forEach(function(v){w.appendChild(mkFb(v,v===fDept,'',function(val){return function(){fDept=val;pg=1;buildF();renderAll()}}(v)))});
  w=document.getElementById('f-abs');w.innerHTML='';
  var vc=EMP.filter(function(e){return e.absence&&e.absence.type==='vacation'}).length;
  var sc=EMP.filter(function(e){return e.absence&&e.absence.type==='sick'}).length;
  var ac=EMP.filter(function(e){return !!e.absence}).length;
  [['Все','Все',''],['Отпуск ('+vc+')','vacation','fvac'],['Больничный ('+sc+')','sick','fsick'],['Все отсутствующие ('+ac+')','absent','']].forEach(function(r){
    w.appendChild(mkFb(r[0],r[1]===fAbs,r[2],function(val){return function(){fAbs=val;pg=1;buildF();renderAll()}}(r[1])));
  });
  w=document.getElementById('f-pres');w.innerHTML='';
  var ic=EMP.filter(function(e){return inOff(e)&&!e.absence}).length;
  [['Все','Все',''],['В офисе ('+ic+')','inoffice','fin'],['Удалённо','remote','frem']].forEach(function(r){
    w.appendChild(mkFb(r[0],r[1]===fPres,r[2],function(val){return function(){fPres=val;pg=1;buildF();renderAll()}}(r[1])));
  });
  // hobby cloud
  buildHobCloud();
}

function buildHobCloud(){
  var w=document.getElementById('f-hob');if(!w)return;
  var q=(document.getElementById('f-hob-search')||{}).value||'';q=q.toLowerCase().trim();
  var all=allHobbies();
  w.innerHTML='';
  var any=false;
  all.forEach(function(h){
    if(q&&h.toLowerCase().indexOf(q)<0)return;
    any=true;
    var b=document.createElement('button');
    b.className='fb'+(h===fHob?' on':'');
    b.textContent=h;
    b.onclick=function(){fHob=h===fHob?'Все':h;pg=1;buildHobCloud();renderAll();renderAF()};
    w.appendChild(b);
  });
  if(!any){var s=document.createElement('span');s.style.cssText='font-size:11px;color:var(--tx3)';s.textContent='Ничего не найдено';w.appendChild(s);}
}

  var subs=colSubs(eid);subs.splice(idx,1);

function openEF(id){
  var e=EMP.find(function(x){return x.id===id}),ct=getCt(e),ef=document.getElementById('ef-'+id);
  var phRows=(ct.phones||[]).map(function(v,i){return '<div class="efrow" id="eph-'+id+'-'+i+'"><input class="efinp" id="epi-'+id+'-'+i+'" value="'+v+'" placeholder="+7 900 000-00-00"><button class="efrm" onclick="rmEF(\'ph\','+id+','+i+')">✕</button></div>'}).join('');
  var intRows=(ct.ints||[]).map(function(v,i){return '<div class="efrow" id="eint-'+id+'-'+i+'"><input class="efinp" id="eii-'+id+'-'+i+'" value="'+v+'" placeholder="101"><button class="efrm" onclick="rmEF(\'int\','+id+','+i+')">✕</button></div>'}).join('');
  var aliRows=(ct.aliases||[]).map(function(v,i){return '<div class="efrow" id="eali-'+id+'-'+i+'"><input class="efinp" id="eai-'+id+'-'+i+'" value="'+v+'" placeholder="alias@company.ru"><button class="efrm" onclick="rmEF(\'ali\','+id+','+i+')">✕</button></div>'}).join('');
  ef.innerHTML=
    '<div class="efg"><div class="eflbl">Внутренние номера</div><div id="eints-'+id+'">'+intRows+'</div><button class="efadd" onclick="addEF(\'int\','+id+')">+ Внутренний</button></div>'+
    '<div class="efg"><div class="eflbl">Мобильные</div><div id="ephs-'+id+'">'+phRows+'</div><button class="efadd" onclick="addEF(\'ph\','+id+')">+ Мобильный</button></div>'+
    '<div class="efg"><div class="eflbl">Telegram</div><input class="efinp" id="etg-'+id+'" value="'+(ct.tg||'')+'" placeholder="@username"></div>'+
    '<div class="efg"><div class="eflbl">ВКонтакте</div><input class="efinp" id="evk-'+id+'" value="'+(ct.vk||'')+'" placeholder="vk.com/username"></div>'+
    '<div class="efg"><div class="eflbl">Основной Email</div><input class="efinp" id="eem-'+id+'" value="'+(ct.email||'')+'" placeholder="email@company.ru"></div>'+
    '<div class="efg"><div class="eflbl">Email-алиасы</div><div id="ealis-'+id+'">'+aliRows+'</div><button class="efadd" onclick="addEF(\'ali\','+id+')">+ Алиас</button></div>'+
    '<div class="efbtns"><button class="efcancel" onclick="togEdit('+id+')">Отмена</button><button class="efsave" onclick="saveEF('+id+')">Сохранить</button></div>';
}
function colEF(pref,cont){var r=[],i=0;while(true){var inp=document.getElementById(pref+i);if(!inp)break;var v=inp.value.trim();if(v)r.push(v);i++}return r}
function snapEF(id){
  var ct=getCt(EMP.find(function(x){return x.id===id}));
  ct.ints=colEF('eii-'+id+'-','eints-'+id);
  ct.phones=colEF('epi-'+id+'-','ephs-'+id);
  ct.aliases=colEF('eai-'+id+'-','ealis-'+id);
  var tgEl=document.getElementById('etg-'+id),vkEl=document.getElementById('evk-'+id),emEl=document.getElementById('eem-'+id);
  if(tgEl)ct.tg=tgEl.value.trim();if(vkEl)ct.vk=vkEl.value.trim();if(emEl)ct.email=emEl.value.trim();
  cEdits[id]=ct;return ct;
}
function addEF(pref,id){
  var ct=snapEF(id);
  if(pref==='ph')ct.phones.push('');else if(pref==='int')ct.ints.push('');else ct.aliases.push('');
  cEdits[id]=ct;openEF(id);
}
function rmEF(pref,id,idx){
  var ct=snapEF(id);
  if(pref==='ph')ct.phones.splice(idx,1);else if(pref==='int')ct.ints.splice(idx,1);else ct.aliases.splice(idx,1);
  cEdits[id]=ct;openEF(id);
}
function saveEF(id){
  var ct=snapEF(id);var e=EMP.find(function(x){return x.id===id});
  if(!ct.phones.length)ct.phones=[e.phones[0]];cEdits[id]=ct;
  var ef=document.getElementById('ef-'+id),cv=document.getElementById('cv-'+id),btn=document.getElementById('etogbtn');
  ef.classList.remove('on');cv.style.display='';btn.textContent='Редактировать';
  var phRows=ct.phones.map(function(ph){return '<div class="crow"><div class="cic cph">📞</div><div class="ct"><div class="ctlbl">Мобильный</div><a href="tel:'+ph+'">'+ph+'</a></div></div>'}).join('');
  var intRows=ct.ints.map(function(n){return '<div class="crow"><div class="cic cint">☎</div><div class="ct"><div class="ctlbl">Внутренний</div><div class="ctval">'+n+'</div></div></div>'}).join('');
  var tgRow=ct.tg?'<div class="crow"><div class="cic ctg">TG</div><div class="ct"><div class="ctlbl">Telegram</div><a href="https://t.me/'+ct.tg.replace('@','')+'" target="_blank">'+ct.tg+'</a></div></div>':'';
  var vkRow=ct.vk?'<div class="crow"><div class="cic cvk">ВК</div><div class="ct"><div class="ctlbl">ВКонтакте</div><a href="https://'+ct.vk+'" target="_blank">'+ct.vk+'</a></div></div>':'';
  var aliHtml=ct.aliases&&ct.aliases.length?'<div class="aliaslist">'+ct.aliases.map(function(a){return '<div class="aliasitem">↳ '+a+'</div>'}).join('')+'</div>':'';
  var emRow='<div class="crow"><div class="cic cem">✉</div><div class="ct"><div class="ctlbl">Email</div><div class="ctval"><a href="mailto:'+ct.email+'">'+ct.email+'</a>'+aliHtml+'</div></div></div>';
  cv.innerHTML='<div class="crow"><div class="cic cdept">🏢</div><div class="ct"><div class="ctlbl">Отдел</div><div class="ctval">'+e.dept+'</div></div></div>'+
    '<div class="crow"><div class="cic coff">📍</div><div class="ct"><div class="ctlbl">Офис</div><div class="ctval">'+e.off+'</div></div></div>'+
    intRows+phRows+tgRow+vkRow+emRow;
  renderAll();
}

// ─── CHARTS ───────────────────────────────────────────────────────────────
var CY=(function(){var a=[];for(var y=1997;y<=2024;y++)a.push(y);return a})();
var HC=[3,5,8,12,18,25,34,45,58,70,82,95,105,115,122,130,138,145,152,160,168,175,182,190,196,200,200,200].map(function(v,i){return {year:CY[i],value:v}});
var AG=[27,28,28,29,29,30,30,31,31,32,32,33,33,33,34,34,34,35,35,35,36,36,36,36,37,37,37,37].map(function(v,i){return {year:CY[i],value:v}});
var TN=[0.3,0.8,1.2,1.5,1.9,2.3,2.8,3.1,3.4,3.2,3.5,3.8,4.1,4.4,4.2,4.5,4.8,5.0,4.6,4.9,5.2,5.4,5.1,5.5,5.7,5.9,6.1,6.3].map(function(v,i){return {year:CY[i],value:v}});

function drawChart(svgId,data,color,unit){
  var svg=document.getElementById(svgId);if(!svg)return;
  var W=parseInt(svg.getAttribute('viewBox').split(' ')[2]),H=200;
  var PL=38,PR=12,PT=8,PB=28,cW=W-PL-PR,cH=H-PT-PB;
  var vals=data.map(function(d){return d.value});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=mx-mn||1;
  function xOf(i){return PL+i*(cW/(data.length-1))}
  function yOf(v){return PT+cH-((v-mn)/rng)*cH}
  var gl='',yl='',xl='';
  for(var t=0;t<=4;t++){var v=mn+rng*t/4,yy=yOf(v);gl+='<line x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'" stroke="#F0EDE8" stroke-width="1"/>';yl+='<text x="'+(PL-5)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="9" fill="#9E9994">'+Math.round(v)+'</text>'}
  data.forEach(function(d,i){if((d.year-1997)%4===0||d.year===2024)xl+='<text x="'+xOf(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#9E9994">'+d.year+'</text>'});
  var aD='M'+xOf(0)+','+yOf(data[0].value);data.forEach(function(d,i){if(i>0)aD+=' L'+xOf(i).toFixed(1)+','+yOf(d.value).toFixed(1)});
  aD+=' L'+xOf(data.length-1).toFixed(1)+','+(PT+cH).toFixed(1)+' L'+xOf(0).toFixed(1)+','+(PT+cH).toFixed(1)+' Z';
  var lD='M'+xOf(0).toFixed(1)+','+yOf(data[0].value).toFixed(1);data.forEach(function(d,i){if(i>0)lD+=' L'+xOf(i).toFixed(1)+','+yOf(d.value).toFixed(1)});
  var dots=data.map(function(d,i){return '<circle cx="'+xOf(i).toFixed(1)+'" cy="'+yOf(d.value).toFixed(1)+'" r="2" fill="'+color+'" opacity=".6"/>'}).join('');
  var lx=xOf(data.length-1),ly=yOf(data[data.length-1].value),lv=data[data.length-1].value;
  svg.innerHTML='<defs><linearGradient id="g'+svgId+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".15"/><stop offset="100%" stop-color="'+color+'" stop-opacity=".01"/></linearGradient></defs>'+gl+yl+xl+'<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+cH)+'" stroke="#F0EDE8" stroke-width="1"/><path d="'+aD+'" fill="url(#g'+svgId+')"/><path d="'+lD+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4" fill="'+color+'"/><text x="'+(lx-4).toFixed(1)+'" y="'+(ly-8).toFixed(1)+'" text-anchor="end" font-size="10" font-weight="500" fill="'+color+'">'+lv+unit+'</text>';
}
function renderCharts(){
  if(chartsDrawn)return;chartsDrawn=true;
  var tot=EMP.length,avg=EMP.reduce(function(s,e){return s+yAt(e.joined)},0)/tot;
  document.getElementById('an-total').textContent=tot;
  document.getElementById('an-avg').textContent=avg.toFixed(1);
  setTimeout(function(){drawChart('svg-hc',HC,'#2D6A4F',' чел.');drawChart('svg-age',AG,'#5E4A8B',' лет');drawChart('svg-tenure',TN,'#C17435',' лет')},50);
}
