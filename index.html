<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Команда</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0;--surface:#fff;--surface2:#F0EDE8;
  --border:rgba(0,0,0,.08);--border-md:rgba(0,0,0,.14);
  --text:#1A1814;--text2:#6B6660;--text3:#9E9994;
  --green:#2D6A4F;--green-dk:#1B4332;--green-bg:#E8F4EE;
  --r:14px;--rsm:8px;
  --sh:0 2px 12px rgba(0,0,0,.06);--shlg:0 8px 40px rgba(0,0,0,.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:rgba(247,245,240,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 16px;gap:12px}
.logo{font-family:'Fraunces',serif;font-size:18px;font-weight:500;color:var(--text);letter-spacing:-.02em;white-space:nowrap}
.logo span{color:var(--green)}
.hdr-tabs{display:flex;gap:4px}
.htab{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border-md);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.htab.active{background:var(--green);color:#fff;border-color:var(--green)}
.hdr-right{margin-left:auto;font-size:11px;color:var(--text3);white-space:nowrap}

/* MAIN */
.main{max-width:1280px;margin:0 auto;padding:16px 14px 80px}
.tab-pane{display:none}.tab-pane.active{display:block}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.sc.click{cursor:pointer;transition:border-color .15s}
.sc.click:hover{border-color:var(--border-md)}
.sc.active-stat{border-color:var(--green)}
.sc-n{font-family:'Fraunces',serif;font-size:26px;font-weight:300;line-height:1;margin-bottom:2px}
.sc-l{font-size:10px;color:var(--text3)}
.sc.active-stat .sc-l{color:var(--green);font-weight:500}

/* SEARCH */
.search-row{position:relative;margin-bottom:10px}
.search-row input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--border-md);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--surface);color:var(--text);outline:none;box-shadow:var(--sh);-webkit-appearance:none;appearance:none}
.search-row input:focus{border-color:var(--green)}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3);pointer-events:none}

/* FILTER GROUPS — collapsible on mobile */
.filters-wrap{margin-bottom:16px}
.fg-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--surface);border:1px solid var(--border-md);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text2);cursor:pointer;box-shadow:var(--sh);margin-bottom:6px}
.fg-toggle .arrow{font-size:10px;transition:transform .2s}
.fg-toggle.open .arrow{transform:rotate(180deg)}
.fg-body{display:none;padding:10px 0 6px}
.fg-body.open{display:block}
.fg-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.fg-lbl{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);white-space:nowrap;min-width:72px;padding-top:7px}
.fbwrap{display:flex;flex-wrap:wrap;gap:5px}
.fb{font-family:'DM Sans',sans-serif;font-size:11px;padding:5px 11px;border-radius:40px;border:1px solid var(--border-md);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.fb:hover,.fb:active{border-color:var(--green);color:var(--green)}
.fb.active{background:var(--green);color:#fff;border-color:var(--green)}
.fb.f-vac{border-color:#E4A030;color:#8A4F00}.fb.f-vac.active{background:#E4A030;border-color:#E4A030;color:#fff}
.fb.f-sick{border-color:#D85A5A;color:#8B2020}.fb.f-sick.active{background:#D85A5A;border-color:#D85A5A;color:#fff}
.fb.f-in{border-color:var(--green);color:var(--green)}.fb.f-in.active{background:var(--green);color:#fff}
.fb.f-remote{border-color:#9E9994;color:#6B6660}.fb.f-remote.active{background:#6B6660;border-color:#6B6660;color:#fff}
.active-filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.af-chip{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--green-bg);color:var(--green-dk);border:1px solid rgba(45,106,79,.2);cursor:pointer;display:flex;align-items:center;gap:4px}
.af-chip::after{content:'×';font-size:12px;opacity:.7}

/* SECTION */
.slbl{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.slbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:4px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s;animation:fu .25s ease both;-webkit-tap-highlight-color:transparent}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card:active{transform:scale(.98)}
.card.ev-bday{border-color:#F0997B}.card.ev-jubday{border-color:#E4A030}
.card.ev-jubwork{border-color:#8B72C8}.card.ev-both{border-color:#2D9970}
.card.absent{opacity:.82}
.abs-strip{position:absolute;top:0;left:0;right:0;height:3px}
.abs-strip.vacation{background:#F5A623}.abs-strip.sick{background:#D85A5A}
.crib{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rb{font-size:9px;font-weight:500;padding:2px 6px;border-radius:20px;white-space:nowrap;line-height:1.5}
.rb-bday{background:#FAECE7;color:#993C1D}.rb-jubday{background:#FEF3DC;color:#8A4F00}
.rb-jubwork{background:#EEE9F8;color:#3D2E6B}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:15px;font-weight:500;margin-bottom:10px;overflow:hidden;flex-shrink:0;position:relative}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.abs-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface)}
.abs-dot.vacation{background:#F5A623}.abs-dot.sick{background:#D85A5A}
.cn{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px;line-height:1.3}
.cr{font-size:10px;color:var(--text2);margin-bottom:6px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.chip{font-size:9px;padding:2px 7px;border-radius:20px;white-space:nowrap}
.chip-dept{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.chip-off{background:#F0EDE8;color:#5A5550;border:1px solid rgba(0,0,0,.08)}
.chip-vac{background:#FEF3DC;color:#8A4F00}.chip-sick{background:#FCE8E8;color:#8B2020}
.chip-in{background:#E8F4EE;color:#1B4332;border:1px solid rgba(45,106,79,.2)}
.bw .bl{font-size:10px;color:var(--text3);margin-bottom:4px}
.bt{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bf{height:100%;border-radius:2px;background:var(--green)}

/* PAGINATION */
.pag{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:20px;flex-wrap:wrap}
.pb{font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 12px;border-radius:40px;border:1px solid var(--border-md);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s}
.pb.active{background:var(--green);color:#fff;border-color:var(--green)}
.pb:disabled{opacity:.4;cursor:default}
.pi{font-size:11px;color:var(--text3)}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(20,16,10,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;transform:translateY(30px);transition:transform .25s cubic-bezier(.32,.72,0,1);position:relative}
.overlay.open .modal{transform:translateY(0)}
@media(min-width:640px){.overlay{align-items:center}.modal{border-radius:20px;max-height:88vh;margin:20px}}
.drag{width:36px;height:4px;background:var(--border-md);border-radius:2px;margin:12px auto 0}
.mi{padding:18px 18px 24px}
.mh{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.mav-wrap{position:relative;flex-shrink:0}
.mav{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px;font-weight:500;overflow:hidden;cursor:pointer;position:relative}
.mav img{width:100%;height:100%;object-fit:cover}
.ah{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;font-size:10px;color:#fff;text-align:center;line-height:1.3;font-family:'DM Sans',sans-serif}
.mav:hover .ah{display:flex}
.mav-abs{position:absolute;bottom:0;right:0;width:17px;height:17px;border-radius:50%;border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:8px}
.mav-abs.vacation{background:#F5A623}.mav-abs.sick{background:#D85A5A}
.mn{font-family:'Fraunces',serif;font-size:17px;font-weight:500;line-height:1.2;color:var(--text)}
.mrole{font-size:12px;color:var(--text2);margin:3px 0 8px}
.xbtn{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--border-md);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text2)}

/* MODAL TABS */
.mtabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.mtab{font-size:13px;padding:8px 14px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.mtab.active{color:var(--green);border-bottom-color:var(--green);font-weight:500}

/* BANNERS */
.bnr{border-radius:var(--rsm);padding:9px 12px;margin-bottom:8px;font-size:12px}
.bnr.bn-bday{background:#FAECE7;color:#993C1D}
.bnr.bn-jubday{background:#FEF3DC;color:#8A4F00}
.bnr.bn-jubwork{background:#EEE9F8;color:#3D2E6B}

/* ABSENCE */
.abs-block{border-radius:var(--rsm);padding:12px 14px;margin-bottom:14px;border:1px solid var(--border)}
.abs-block.vacation{background:#FFFBF0;border-left:3px solid #F5A623}
.abs-block.sick{background:#FFF5F5;border-left:3px solid #D85A5A}
.abs-block-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:5px}
.abs-block-row{font-size:12px;color:var(--text2);margin-bottom:2px}
.abs-block-row b{color:var(--text)}

/* PRESENCE */
.presence-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:var(--rsm);padding:9px 12px;margin-bottom:14px;border:1px solid var(--border)}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pdot.in{background:var(--green);box-shadow:0 0 0 3px rgba(45,106,79,.18)}
.pdot.out{background:var(--text3)}
.ptxt{font-size:12px;color:var(--text2);flex:1}
.pip{font-size:10px;color:var(--text3);font-family:monospace}

/* INFO GRID */
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:14px}
.il{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:3px}
.iv{font-size:13px;font-weight:500;color:var(--text)}
.full{grid-column:1/-1}

/* CONTACTS */
.cb{margin-bottom:14px}
.cb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cb-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.edit-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border-md);background:var(--surface);color:var(--green);cursor:pointer;font-family:'DM Sans',sans-serif}
.crow{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.crow:last-child{border:none}
.cic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:500}
.cic-ph{background:#E1F5EE}.cic-int{background:#E8F4EE}.cic-tg{background:#E6F1FB}
.cic-vk{background:#E8EFFE}.cic-em{background:#EEEDFE}.cic-dept{background:#EEE9F8}.cic-off{background:#F0EDE8}
.ct{font-size:12px;color:var(--text);min-width:0}
.ct a{color:var(--green);text-decoration:none;word-break:break-all}
.ct-lbl{font-size:10px;color:var(--text3);margin-bottom:1px}
.ct-val{font-size:12px;color:var(--text);word-break:break-all}
.alias-list{margin-top:2px}
.alias-item{font-size:11px;color:var(--text2)}

/* EDIT FORM */
.edit-form{display:none}
.edit-form.open{display:block}
.ef-group{margin-bottom:12px}
.ef-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px}
.ef-input{width:100%;padding:8px 10px;border:1px solid var(--border-md);border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface);color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
.ef-input:focus{border-color:var(--green)}
.ef-row{display:flex;gap:6px;margin-bottom:6px}
.ef-row .ef-input{flex:1;min-width:0}
.ef-add{font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--border-md);background:transparent;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif}
.ef-rm{width:26px;height:26px;border-radius:50%;border:1px solid var(--border-md);background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.ef-btns{display:flex;gap:8px;margin-top:8px}
.ef-save{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 18px;border-radius:40px;border:none;background:var(--green);color:#fff;cursor:pointer;flex:1}
.ef-cancel{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 14px;border-radius:40px;border:1px solid var(--border-md);background:transparent;color:var(--text2);cursor:pointer}

/* HOBBIES */
.hb{margin-bottom:16px}
.hb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:4px 11px;border-radius:20px;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.tag-rm{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--green-bg);color:var(--green-dk);border:1px solid rgba(45,106,79,.2);display:inline-flex;align-items:center;gap:5px}
.tag-rm .x{font-size:13px;line-height:1;cursor:pointer;opacity:.6;font-weight:500}
.tag-rm .x:hover{opacity:1}

/* HOBBY CLOUD PICKER */
.hobby-picker{margin-top:10px}
.hobby-picker-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.hobby-cloud{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.hobby-cloud-tag{font-size:11px;padding:4px 11px;border-radius:20px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none}
.hobby-cloud-tag:hover,.hobby-cloud-tag:active{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.hobby-cloud-tag.used{opacity:.35;cursor:default;pointer-events:none}
.hobby-divider{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.hobby-divider::before,.hobby-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.hobby-add-row{display:flex;gap:6px}
.hobby-add-row input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--border-md);border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:12px;background:var(--surface);color:var(--text);outline:none;-webkit-appearance:none}
.hobby-add-row input:focus{border-color:var(--green)}
.hobby-add-btn{font-size:12px;padding:7px 14px;border-radius:40px;border:none;background:var(--green);color:#fff;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}

/* SUBSTITUTE EDIT */
.sub-link{color:var(--green);text-decoration:none;font-weight:inherit;cursor:pointer}
.sub-link:hover{text-decoration:underline}
.sub-edit-row{display:flex;gap:6px;align-items:center;margin-top:4px}
.sub-edit-row input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--border-md);border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:12px;background:var(--surface);color:var(--text);outline:none;-webkit-appearance:none}
.sub-edit-row input:focus{border-color:var(--green)}
.sub-save{font-size:11px;padding:5px 12px;border-radius:20px;border:none;background:var(--green);color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.sub-cancel{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--border-md);background:transparent;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif}
.sub-pencil{font-size:11px;color:var(--text3);cursor:pointer;margin-left:4px;opacity:.7}
.sub-pencil:hover{opacity:1;color:var(--green)}

/* ACTIONS */
.macts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:'DM Sans',sans-serif;font-size:12px;padding:9px 14px;border-radius:40px;border:1px solid var(--border-md);background:var(--bg);color:var(--text2);cursor:pointer;flex:1;min-width:120px;text-align:center}
.btn.pr{background:var(--green);color:#fff;border-color:var(--green)}

/* CHARTS */
.charts-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.chart-title{font-family:'Fraunces',serif;font-size:15px;font-weight:500;color:var(--text);margin-bottom:3px}
.chart-sub{font-size:11px;color:var(--text3);margin-bottom:16px}
.chart-svg{width:100%;overflow:visible;display:block}
.analytics-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.an-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px}
.an-stat-n{font-family:'Fraunces',serif;font-size:36px;font-weight:300;line-height:1;color:var(--text)}
.an-stat-l{font-size:11px;color:var(--text3)}

/* COMPANY COLORS */
.co-tktel{background:#E6F1FB;color:#0C447C}.co-centr{background:#EEE9F8;color:#3D2E6B}
.co-region{background:#E1F5EE;color:#0F6E56}.co-mts{background:#FAECE7;color:#993C1D}
.co-santel{background:#FEF3DC;color:#8A4F00}.co-fiber{background:#EAF3DE;color:#3B6D11}
.co-ukpf{background:#FBEAF0;color:#993556}.co-blitz{background:#FCE8E8;color:#8B2020}
.co-quick{background:#E8F0FE;color:#1A4080}

.empty{text-align:center;padding:50px 20px;color:var(--text3);font-size:14px}

/* RESPONSIVE */
@media(max-width:500px){
  .stats{grid-template-columns:repeat(2,1fr);gap:6px}
  .sc-n{font-size:22px}
  .analytics-stats{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .charts-wrap{grid-template-columns:1fr}
  .macts{flex-direction:column}
  .btn{min-width:unset}
  .ig{grid-template-columns:1fr 1fr}
  .hdr-right{display:none}
}
@media(max-width:340px){
  .grid{grid-template-columns:1fr}
}
@media(min-width:768px){

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
var COMPANIES=['ТКТЕЛ','ЦЕНТР','Регион','МТС','Сантел','Файбер коннект','УК ПФ','Блицтелеком','Квиклайн'];
var OFFICES=['Микояна','Электрозаводская','Красногорск','Элиста'];
var DEPTS=['Разработка','Маркетинг','HR','Финансы','Продажи','Дизайн','Техподдержка','Бухгалтерия','Юридический','Операции'];
var ROLES=['Руководитель отдела','Старший специалист','Специалист','Менеджер','Аналитик','Инженер','Координатор','Эксперт','Ведущий специалист','Младший специалист','Team Lead','Бизнес-аналитик','Системный администратор','Директор по развитию','Технический директор'];
var HPOOL=['Горные лыжи','Фотография','Велоспорт','Игры','Кулинария','Йога','Путешествия','Бег','Книги','Теннис','Рисование','Шахматы','Хайкинг','Танцы','Театр','Скетчинг','Кино','Музыка','Садоводство','Рыбалка','Мотоциклы','Гольф','Плавание','Подкасты','SMM','Психология'];
var FIRSTS=['Анна','Дмитрий','Мария','Сергей','Екатерина','Алексей','Ольга','Никита','Виктория','Артём','Наталья','Павел','Ирина','Роман','Елена','Максим','Юлия','Андрей','Татьяна','Иван','Светлана','Кирилл','Людмила','Денис','Нина','Евгений','Валентина','Михаил','Галина','Станислав','Оксана','Владимир','Лариса','Антон','Надежда','Константин','Вера','Тимур','Зоя','Руслан'];
var LASTS=['Петрова','Козлов','Иванова','Новиков','Смирнова','Волков','Кузнецова','Попов','Соколова','Михайлов','Борисова','Громов','Семёнова','Захаров','Фёдорова','Орлов','Морозова','Лебедев','Павлова','Никитин','Соловьёв','Тихонова','Медведев','Степанова','Васильев','Белова','Зайцев','Миронова','Чернов','Голубева','Виноградов','Богданова','Матвеева','Фролов','Давыдова','Гусев','Макарова','Сидоров','Егорова','Климова'];
var CO_CLS={'ТКТЕЛ':'co-tktel','ЦЕНТР':'co-centr','Регион':'co-region','МТС':'co-mts','Сантел':'co-santel','Файбер коннект':'co-fiber','УК ПФ':'co-ukpf','Блицтелеком':'co-blitz','Квиклайн':'co-quick'};
var AVC=[{bg:'#E6F1FB',t:'#0C447C'},{bg:'#EEE9F8',t:'#3D2E6B'},{bg:'#E1F5EE',t:'#0F6E56'},{bg:'#FEF3DC',t:'#8A4F00'},{bg:'#FAECE7',t:'#7A1D30'},{bg:'#EAF3DE',t:'#3B6D11'},{bg:'#FBEAF0',t:'#993556'},{bg:'#E8F0FE',t:'#1A4080'},{bg:'#FCE8E8',t:'#8B2020'},{bg:'#F0E8FE',t:'#5B1AAD'}];
var OFFICE_IPS={'Микояна':['192.168.10.','192.168.11.'],'Электрозаводская':['192.168.20.','192.168.21.'],'Красногорск':['192.168.30.','192.168.31.'],'Элиста':['192.168.40.','192.168.41.']};

// seeded rng
function mkRng(s){return function(){s=(s*1664525+1013904223)>>>0;return s/0x100000000}}
function pad2(n){return n<10?'0'+n:''+n}
function rndDate(y1,y2,r){var y=y1+Math.floor(r()*(y2-y1+1)),m=1+Math.floor(r()*12),d=1+Math.floor(r()*27);return y+'-'+pad2(m)+'-'+pad2(d)}
function rndFut(mn,mx,r){var d=new Date();d.setDate(d.getDate()+mn+Math.floor(r()*(mx-mn)));return d.toISOString().slice(0,10)}
function shuf(a,r){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b}
function demoDate(days,yback){var d=new Date();d.setDate(d.getDate()+days);return (d.getFullYear()-yback)+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}

var EMP=[];
var rng=mkRng(42);
for(var i=1;i<=200;i++){
  var fn=FIRSTS[(i-1)%FIRSTS.length];
  var ln=LASTS[(i-1)%LASTS.length];
  var co=COMPANIES[Math.floor((i-1)*COMPANIES.length/200)];
  var office=OFFICES[Math.floor((i-1)*OFFICES.length/200)];
  var dept=DEPTS[(i-1)%DEPTS.length];
  var role=ROLES[(i-1)%ROLES.length];
  var ph=['+7 '+String(900+Math.floor(rng()*99))+' '+String(100+Math.floor(rng()*899))+'-'+pad2(10+Math.floor(rng()*89))+'-'+pad2(10+Math.floor(rng()*89))];
  if(i%6===0)ph.push('+7 '+String(900+Math.floor(rng()*99))+' '+String(100+Math.floor(rng()*899))+'-'+pad2(10+Math.floor(rng()*89))+'-'+pad2(10+Math.floor(rng()*89)));
  var tgl=fn.toLowerCase().replace(/[ёе]/g,'e').replace(/[^a-z]/gi,'');
  var lnl=ln.toLowerCase().replace(/[ёе]/g,'e').replace(/[^a-z]/gi,'').slice(0,5);
  var tg='@'+tgl+'_'+lnl;
  var email=fn[0].toLowerCase()+'.'+lnl+'@company.ru';
  var hobbies=shuf(HPOOL,rng).slice(0,2+Math.floor(rng()*3));
  var born=rndDate(1974,2000,rng);
  var joined=rndDate(2010,2024,rng);
  var mgr=i>1?FIRSTS[(i+3)%FIRSTS.length]+' '+LASTS[(i+7)%LASTS.length]:'—';
  var intBase=100+i;
  var internals=[String(intBase)];
  if(i%4===0)internals.push(String(intBase+500));
  var vk=i%5!==0?'vk.com/'+tgl+String(Math.floor(rng()*999)):'';
  var emailAliases=[];
  if(i%3===0)emailAliases.push(ln.toLowerCase().replace(/[ёе]/g,'e').replace(/[^a-z]/gi,'')+'@company.ru');
  if(i%7===0)emailAliases.push(tgl+'.'+lnl+'@company.ru');
  var absence=null;
  if(i%7===0){var sf=FIRSTS[(i+5)%FIRSTS.length],sl=LASTS[(i+9)%LASTS.length];absence={type:'vacation',until:rndFut(2,21,rng),substitute:sf+' '+sl};}
  else if(i%13===0){var sf2=FIRSTS[(i+2)%FIRSTS.length],sl2=LASTS[(i+4)%LASTS.length];absence={type:'sick',until:rndFut(1,10,rng),substitute:sf2+' '+sl2};}
  var ranges=OFFICE_IPS[office]||[];
  var lastSeenIP=null;
  if(ranges.length&&i%3===0&&!absence){lastSeenIP=ranges[0]+String(10+Math.floor(rng()*200));}
  EMP.push({id:i,name:fn+' '+ln,fn:fn,ln:ln,co:co,office:office,dept:dept,role:role,born:born,joined:joined,manager:mgr,phones:ph,internals:internals,tg:tg,vk:vk,email:email,emailAliases:emailAliases,hobbies:hobbies,absence:absence,lastSeenIP:lastSeenIP});
}

// Demo overrides
EMP[0].born=demoDate(1,45);EMP[0].name='Ирина Семёнова';EMP[0].co='ТКТЕЛ';EMP[0].office='Микояна';
EMP[1].joined=demoDate(3,10);EMP[1].name='Роман Захаров';EMP[1].co='ЦЕНТР';EMP[1].office='Электрозаводская';
EMP[2].born=demoDate(5,30);EMP[2].name='Анна Петрова';EMP[2].co='МТС';EMP[2].office='Красногорск';
EMP[3].born=demoDate(2,0);EMP[3].joined=demoDate(2,5);EMP[3].name='Дмитрий Козлов';EMP[3].co='Квиклайн';EMP[3].office='Элиста';
EMP[4].born=demoDate(0,50);EMP[4].name='Сергей Новиков';EMP[4].co='Сантел';EMP[4].office='Микояна';
EMP[10].absence={type:'vacation',until:rndFut(3,14,mkRng(99)),substitute:'Ольга Кузнецова'};EMP[10].name='Виктория Соколова';EMP[10].lastSeenIP=null;
EMP[20].absence={type:'sick',until:rndFut(1,7,mkRng(77)),substitute:'Павел Громов'};EMP[20].name='Алексей Волков';EMP[20].lastSeenIP=null;

// ── STATE ──────────────────────────────────────────────────────────────────
var contactEdits={};
var hobbyEdits={};   // id -> string[]
var absEdits={};     // id -> {substitute:string}
var photos={};
var upId=null,fCo='Все',fOff='Все',fDept='Все',fAbs='Все',fPres='Все',pg=1;
var PER=30;
var modalTab='info';
var editingId=null;
var chartsDrawn=false;

// ── HELPERS ────────────────────────────────────────────────────────────────
var msY=365.25*24*3600*1000;
function yAt(d){return (Date.now()-new Date(d))/msY}
function fmtY(y){var n=Math.floor(y);return n+(n===1?' год':n<5?' года':' лет')}
function fmtD(s,o){try{return new Date(s).toLocaleDateString('ru-RU',o)}catch(e){return s}}
function fmtUntil(s){return fmtD(s,{day:'numeric',month:'long'})}
function ini(n){return n.split(' ').map(function(w){return w[0]}).join('').slice(0,2)}
function acol(id){return AVC[(id-1)%AVC.length]}
function isInOffice(e){var ranges=OFFICE_IPS[e.office]||[];return ranges.some(function(r){return e.lastSeenIP&&e.lastSeenIP.indexOf(r)===0})}
function getContacts(e){return contactEdits[e.id]||{phones:e.phones.slice(),internals:e.internals.slice(),tg:e.tg,vk:e.vk,email:e.email,emailAliases:e.emailAliases.slice()}}

function daysUntil(s){
  var now=new Date();now.setHours(0,0,0,0);
  var d=new Date(s);var nx=new Date(now.getFullYear(),d.getMonth(),d.getDate());
  if(nx<now)nx.setFullYear(now.getFullYear()+1);
  return Math.round((nx-now)/86400000);
}
function evOf(e){
  var bD=daysUntil(e.born),bs=bD<=7;
  var age=Math.floor(yAt(e.born)),ta=age+(bD===0?0:1);
  var jd=bs&&ta%5===0?ta:null;
  var jn=new Date(e.joined),now=new Date();now.setHours(0,0,0,0);
  var nx=new Date(now.getFullYear(),jn.getMonth(),jn.getDate());
  if(nx<now)nx.setFullYear(now.getFullYear()+1);
  var aD=Math.round((nx-now)/86400000);
  var yrs=Math.round(yAt(e.joined));
  var roundY=[1,2,3,5,7,10,15,20,25,30];
  var jw=aD<=7&&roundY.indexOf(yrs)>=0?{days:aD,years:yrs}:null;
  return {bD:bD,bs:bs,jd:jd,jw:jw};
}
function hasEv(e){var v=evOf(e);return v.bs||!!v.jw}
function dlbl(d){return d===0?'Сегодня':d===1?'Завтра':'Через '+d+' дн.'}

// ── FILTER ────────────────────────────────────────────────────────────────
function getFiltered(){
  var q=document.getElementById('search').value.toLowerCase().trim();
  return EMP.filter(function(e){
    if(fCo!=='Все'&&e.co!==fCo)return false;
    if(fOff!=='Все'&&e.office!==fOff)return false;
    if(fDept!=='Все'&&e.dept!==fDept)return false;
    if(fAbs==='vacation'&&(!e.absence||e.absence.type!=='vacation'))return false;
    if(fAbs==='sick'&&(!e.absence||e.absence.type!=='sick'))return false;
    if(fAbs==='absent'&&!e.absence)return false;
    if(fPres==='inoffice'&&!isInOffice(e))return false;
    if(fPres==='remote'&&isInOffice(e))return false;
    if(!q)return true;
    var ct=getContacts(e);
    var hobbies=getHobbies(e);
    var searchIn=[e.name,e.role,e.dept,e.co,e.office,ct.tg,ct.vk,ct.email,e.absence?e.absence.substitute:'',e.absence&&e.absence.type==='vacation'?'отпуск':e.absence&&e.absence.type==='sick'?'больничный':'',hobbies.join(' ')];
    return searchIn.some(function(s){return s&&s.toLowerCase().indexOf(q)>=0});
  });
}

function sortList(list){
  return list.slice().sort(function(a,b){
    var ea=evOf(a),eb=evOf(b);
    var ah=ea.bs||!!ea.jw,bh=eb.bs||!!eb.jw;
    if(ah&&!bh)return -1;if(!ah&&bh)return 1;
    if(ah&&bh)return Math.min(ea.bD,ea.jw?ea.jw.days:999)-Math.min(eb.bD,eb.jw?eb.jw.days:999);
    return a.name.localeCompare(b.name,'ru');
  });
}

// ── AVATAR ────────────────────────────────────────────────────────────────
function avHtml(e,sz,fs){
  var c=acol(e.id);
  var dot=e.absence?'<div class="abs-dot '+e.absence.type+'"></div>':'';
  if(photos[e.id])return '<div class="av" style="width:'+sz+'px;height:'+sz+'px">'+dot+'<img src="'+photos[e.id]+'" alt=""></div>';
  return '<div class="av" style="width:'+sz+'px;height:'+sz+'px;background:'+c.bg+';color:'+c.t+';font-size:'+fs+'px">'+ini(e.name)+dot+'</div>';
}

// ── CARD ──────────────────────────────────────────────────────────────────
function cardHtml(e){
  var y=yAt(e.joined),pct=Math.min(100,Math.round(y/20*100));
  var ev=evOf(e);
  var cls='';
  if(ev.jd&&ev.jw)cls='ev-both';else if(ev.jd)cls='ev-jubday';else if(ev.jw)cls='ev-jubwork';else if(ev.bs)cls='ev-bday';
  if(e.absence)cls+=' absent';
  var badges='';
  if(ev.jd&&ev.jw)badges='<span class="rb rb-jubday">юбилей '+ev.jd+' лет</span><span class="rb rb-jubwork">с нами '+ev.jw.years+' лет</span>';
  else if(ev.jd)badges='<span class="rb rb-jubday">юбилей '+ev.jd+' лет — '+dlbl(ev.bD)+'</span>';
  else if(ev.jw)badges='<span class="rb rb-jubwork">с нами '+ev.jw.years+' лет — '+dlbl(ev.jw.days)+'</span>';
  else if(ev.bs)badges='<span class="rb rb-bday">ДР — '+dlbl(ev.bD)+'</span>';
  var cc=CO_CLS[e.co]||'';
  var strip=e.absence?'<div class="abs-strip '+e.absence.type+'"></div>':'';
  var absChip='';
  if(e.absence&&e.absence.type==='vacation')absChip='<span class="chip chip-vac">отпуск</span>';
  else if(e.absence&&e.absence.type==='sick')absChip='<span class="chip chip-sick">больничный</span>';
  var inChip=isInOffice(e)&&!e.absence?'<span class="chip chip-in">в офисе</span>':'';
  return '<div class="card'+(cls?' '+cls:'')+'" onclick="openModal('+e.id+')">'+
    strip+'<div class="crib">'+badges+'</div>'+
    avHtml(e,44,15)+
    '<div class="cn">'+e.name+'</div>'+
    '<div class="cr">'+e.role+'</div>'+
    '<div class="chips"><span class="chip '+cc+'">'+e.co+'</span><span class="chip chip-off">'+e.office+'</span>'+inChip+absChip+'</div>'+
    '<div class="bw"><div class="bl">'+e.dept+' · '+fmtY(y)+'</div><div class="bt"><div class="bf" style="width:'+pct+'%"></div></div></div>'+
  '</div>';
}

// ── RENDER ────────────────────────────────────────────────────────────────
function renderAll(){
  try{
    var all=sortList(getFiltered());
    var wEv=all.filter(hasEv),rest=all.filter(function(e){return !hasEv(e)});
    var totPg=Math.ceil(rest.length/PER)||1;
    if(pg>totPg)pg=totPg;
    var items=rest.slice((pg-1)*PER,pg*PER);
    var html='';
    if(wEv.length)html+='<div class="slbl">Ближайшие события (7 дней)</div><div class="grid">'+wEv.map(cardHtml).join('')+'</div>';
    if(rest.length){if(wEv.length)html+='<div class="slbl">Вся команда</div>';html+='<div class="grid">'+items.map(cardHtml).join('')+'</div>';}
    if(!all.length)html='<div class="empty">Никого не найдено</div>';
    document.getElementById('content').innerHTML=html;
    var n=all.length;
    document.getElementById('hdr-info').textContent=n+' '+(n===1?'сотрудник':n<5?'сотрудника':'сотрудников');
    renderPag(totPg,rest.length);
    renderActiveFilters();
  }catch(err){console.error('renderAll error:',err)}
}

function renderPag(tot,cnt){
  var p=document.getElementById('pag');
  if(tot<=1){p.innerHTML='';return}
  var h='<button class="pb" onclick="goP('+(pg-1)+')" '+(pg===1?'disabled':'')+'>&larr;</button>';
  for(var i=1;i<=tot;i++){
    if(i===1||i===tot||Math.abs(i-pg)<=2)h+='<button class="pb'+(i===pg?' active':'')+'" onclick="goP('+i+')">'+i+'</button>';
    else if(Math.abs(i-pg)===3)h+='<span class="pi">&hellip;</span>';
  }
  h+='<button class="pb" onclick="goP('+(pg+1)+')" '+(pg===tot?'disabled':'')+'>&rarr;</button>';
  h+='<span class="pi">'+((pg-1)*PER+1)+'–'+Math.min(pg*PER,cnt)+' из '+cnt+'</span>';
  p.innerHTML=h;
}
function goP(n){pg=n;renderAll();window.scrollTo(0,0)}

function renderActiveFilters(){
  var chips=[];
  if(fCo!=='Все')chips.push({label:'Компания: '+fCo,clear:function(){fCo='Все';pg=1;buildFilters();renderAll()}});
  if(fOff!=='Все')chips.push({label:'Офис: '+fOff,clear:function(){fOff='Все';pg=1;buildFilters();renderAll()}});
  if(fDept!=='Все')chips.push({label:'Отдел: '+fDept,clear:function(){fDept='Все';pg=1;buildFilters();renderAll()}});
  if(fAbs!=='Все'){var absLabel={'vacation':'В отпуске','sick':'На больничном','absent':'Все отсутствующие'};chips.push({label:absLabel[fAbs]||fAbs,clear:function(){fAbs='Все';pg=1;buildFilters();renderAll()}});}
  if(fPres!=='Все'){var presLabel={'inoffice':'В офисе','remote':'Удалённо'};chips.push({label:presLabel[fPres]||fPres,clear:function(){fPres='Все';pg=1;buildFilters();renderAll()}});}
  var wrap=document.getElementById('active-filters');
  wrap.innerHTML='';
  chips.forEach(function(c){
    var btn=document.createElement('button');
    btn.className='af-chip';
    btn.textContent=c.label;
    btn.onclick=c.clear;
    wrap.appendChild(btn);
  });
}

// ── FILTERS ───────────────────────────────────────────────────────────────
function mkBtn(text,isActive,extraCls,onClick){
  var b=document.createElement('button');
  b.className='fb'+(isActive?' active':'')+(extraCls?' '+extraCls:'');
  b.textContent=text;b.onclick=onClick;return b;
}

function buildFilters(){
  var wrap;
  // companies
  wrap=document.getElementById('f-co');wrap.innerHTML='';
  ['Все'].concat(COMPANIES).forEach(function(v){wrap.appendChild(mkBtn(v,v===fCo,'',function(val){return function(){fCo=val;pg=1;buildFilters();renderAll()}}(v)))});
  // offices
  wrap=document.getElementById('f-off');wrap.innerHTML='';
  ['Все'].concat(OFFICES).forEach(function(v){wrap.appendChild(mkBtn(v,v===fOff,'',function(val){return function(){fOff=val;pg=1;buildFilters();renderAll()}}(v)))});
  // depts
  wrap=document.getElementById('f-dept');wrap.innerHTML='';
  ['Все'].concat(DEPTS).forEach(function(v){wrap.appendChild(mkBtn(v,v===fDept,'',function(val){return function(){fDept=val;pg=1;buildFilters();renderAll()}}(v)))});
  // absence
  wrap=document.getElementById('f-abs');wrap.innerHTML='';
  var vacCnt=EMP.filter(function(e){return e.absence&&e.absence.type==='vacation'}).length;
  var sickCnt=EMP.filter(function(e){return e.absence&&e.absence.type==='sick'}).length;
  var absentCnt=EMP.filter(function(e){return !!e.absence}).length;
  [['Все','Все',''],['Отпуск ('+vacCnt+')','vacation','f-vac'],['Больничный ('+sickCnt+')','sick','f-sick'],['Все отсутствующие ('+absentCnt+')','absent','']].forEach(function(row){
    wrap.appendChild(mkBtn(row[0],row[1]===fAbs,row[2],function(val){return function(){fAbs=val;pg=1;buildFilters();renderAll()}}(row[1])));
  });
  // presence
  wrap=document.getElementById('f-presence');wrap.innerHTML='';
  var inCnt=EMP.filter(function(e){return isInOffice(e)&&!e.absence}).length;
  [['Все','Все',''],['В офисе ('+inCnt+')','inoffice','f-in'],['Удалённо','remote','f-remote']].forEach(function(row){
    wrap.appendChild(mkBtn(row[0],row[1]===fPres,row[2],function(val){return function(){fPres=val;pg=1;buildFilters();renderAll()}}(row[1])));
  });
}

function toggleAbs(type){
  fAbs=fAbs===type?'Все':type;pg=1;buildFilters();renderAll();
}
function onSearch(){pg=1;renderAll()}

// ── HOBBY EDITING ──────────────────────────────────────────────────────────
function getHobbies(e){return hobbyEdits[e.id]?hobbyEdits[e.id]:e.hobbies.slice()}

// Build global hobby pool from all employees (union of all hobbies)
function getAllHobbies(){
  var seen={};
  EMP.forEach(function(e){
    getHobbies(e).forEach(function(h){seen[h]=true});
  });
  HPOOL.forEach(function(h){seen[h]=true});
  return Object.keys(seen).sort(function(a,b){return a.localeCompare(b,'ru')});
}

function renderHobbies(e){
  var current=getHobbies(e);
  var all=getAllHobbies();

  var tagsHtml=current.map(function(h,i){
    return '<span class="tag-rm">'+h+'<span class="x" onclick="removeHobby('+e.id+','+i+')" title="Удалить">×</span></span>';
  }).join('');

  // cloud: all hobbies not yet selected
  var cloudHtml=all.map(function(h){
    var used=current.indexOf(h)>=0;
    return '<span class="hobby-cloud-tag'+(used?' used':'')+'"'+(used?'':' onclick="pickHobby('+e.id+',\''+h.replace(/'/g,"\\'")+'\')"')+'>'+h+'</span>';
  }).join('');

  return '<div class="hb-head"><div class="il">Хобби и увлечения</div></div>'+
    '<div class="tags" id="hobby-tags-'+e.id+'">'+(tagsHtml||'<span style="font-size:12px;color:var(--text3)">Пока не добавлено</span>')+'</div>'+
    '<div class="hobby-picker">'+
      '<div class="hobby-picker-lbl">Выбрать из облака</div>'+
      '<div class="hobby-cloud" id="hobby-cloud-'+e.id+'">'+cloudHtml+'</div>'+
      '<div class="hobby-divider">или добавить своё</div>'+
      '<div class="hobby-add-row">'+
        '<input id="hobby-inp-'+e.id+'" placeholder="Например: Сёрфинг" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addHobby('+e.id+')}">'+
        '<button class="hobby-add-btn" onclick="addHobby('+e.id+')">Добавить</button>'+
      '</div>'+
    '</div>';
}

function refreshHobbiesBlock(eid){
  var block=document.getElementById('hb-block-'+eid);
  if(!block)return;
  var e=EMP.find(function(x){return x.id===eid});
  block.innerHTML=renderHobbies(e);
}

function pickHobby(eid,hobby){
  var e=EMP.find(function(x){return x.id===eid});
  var h=getHobbies(e);
  if(h.indexOf(hobby)<0)h.push(hobby);
  hobbyEdits[eid]=h;
  refreshHobbiesBlock(eid);
  renderAll();
}

function addHobby(eid){
  var inp=document.getElementById('hobby-inp-'+eid);
  if(!inp)return;
  var val=inp.value.trim();
  if(!val)return;
  var e=EMP.find(function(x){return x.id===eid});
  var h=getHobbies(e);
  if(h.indexOf(val)<0)h.push(val);
  hobbyEdits[eid]=h;
  inp.value='';
  refreshHobbiesBlock(eid);
  renderAll();
}

function removeHobby(eid,idx){
  var e=EMP.find(function(x){return x.id===eid});
  var h=getHobbies(e);
  h.splice(idx,1);
  hobbyEdits[eid]=h;
  refreshHobbiesBlock(eid);
  renderAll();
}

// ── SUBSTITUTE EDITING ─────────────────────────────────────────────────────
function openSubEdit(eid){
  var view=document.getElementById('sub-view-'+eid);
  var edit=document.getElementById('sub-edit-'+eid);
  if(view)view.style.display='none';
  if(edit)edit.style.display='block';
  var inp=document.getElementById('sub-inp-'+eid);
  if(inp){inp.focus();inp.select();}
}

function closeSubEdit(eid){
  var view=document.getElementById('sub-view-'+eid);
  var edit=document.getElementById('sub-edit-'+eid);
  if(view)view.style.display='';
  if(edit)edit.style.display='none';
}

function saveSubstitute(eid){
  var inp=document.getElementById('sub-inp-'+eid);
  if(!inp)return;
  var val=inp.value.trim();
  if(!val)return;
  if(!absEdits[eid])absEdits[eid]={};
  absEdits[eid].substitute=val;
  // rebuild the substitute row
  var subEmp=EMP.find(function(x){return x.name===val});
  var subLink=subEmp
    ?'<a class="sub-link" href="#" onclick="event.preventDefault();closeModal();setTimeout(function(){openModal('+subEmp.id+')},50)">'+val+'</a>'
    :'<span>'+val+'</span>';
  var view=document.getElementById('sub-view-'+eid);
  if(view)view.innerHTML='Замещает: <b>'+subLink+'</b><span class="sub-pencil" onclick="openSubEdit('+eid+')" title="Изменить">✏️</span>';
  closeSubEdit(eid);
}
function toggleEdit(id){

function collectField(prefix,container){
  var rows=document.querySelectorAll('#'+container+' .ef-row');
  var result=[];
  for(var i=0;i<rows.length;i++){var inp=document.getElementById(prefix+'-'+i);if(inp&&inp.value.trim())result.push(inp.value.trim());}
  return result;
}
function snapshotForm(id){
  var ct=getContacts(EMP.find(function(x){return x.id===id}));
  ct.internals=collectField('int','ints-c');
  ct.phones=collectField('ph','phones-c');
  ct.emailAliases=collectField('alias','aliases-c');
  var tgEl=document.getElementById('ef-tg');var vkEl=document.getElementById('ef-vk');var emEl=document.getElementById('ef-email');
  if(tgEl)ct.tg=tgEl.value.trim();if(vkEl)ct.vk=vkEl.value.trim();if(emEl)ct.email=emEl.value.trim();
  contactEdits[id]=ct;return ct;
}
function addItem(prefix,id){var ct=snapshotForm(id);if(prefix==='ph')ct.phones.push('');else if(prefix==='int')ct.internals.push('');else ct.emailAliases.push('');contactEdits[id]=ct;openEditForm(id);}
function rmItem(prefix,id,idx){var ct=snapshotForm(id);if(prefix==='ph')ct.phones.splice(idx,1);else if(prefix==='int')ct.internals.splice(idx,1);else ct.emailAliases.splice(idx,1);contactEdits[id]=ct;openEditForm(id);}

function saveContacts(id){
  var ct=snapshotForm(id);
  var e=EMP.find(function(x){return x.id===id});
  if(!ct.phones.length)ct.phones=[e.phones[0]];
  contactEdits[id]=ct;
  var ef=document.getElementById('contacts-edit');var cv=document.getElementById('contacts-view');var btn=document.getElementById('edit-toggle-btn');
  ef.classList.remove('open');cv.style.display='';btn.textContent='Редактировать';editingId=null;
  var phs=ct.phones.map(function(ph){return '<div class="crow"><div class="cic cic-ph">📞</div><div class="ct"><div class="ct-lbl">Мобильный</div><a href="tel:'+ph+'">'+ph+'</a></div></div>'}).join('');
  var ints=ct.internals.map(function(n){return '<div class="crow"><div class="cic cic-int">☎</div><div class="ct"><div class="ct-lbl">Внутренний</div><div class="ct-val">'+n+'</div></div></div>'}).join('');
  var tgRow=ct.tg?'<div class="crow"><div class="cic cic-tg">TG</div><div class="ct"><div class="ct-lbl">Telegram</div><a href="https://t.me/'+ct.tg.replace('@','')+'" target="_blank">'+ct.tg+'</a></div></div>':'';
  var vkRow=ct.vk?'<div class="crow"><div class="cic cic-vk">ВК</div><div class="ct"><div class="ct-lbl">ВКонтакте</div><a href="https://'+ct.vk+'" target="_blank">'+ct.vk+'</a></div></div>':'';
  var aliases=ct.emailAliases&&ct.emailAliases.length?'<div class="alias-list">'+ct.emailAliases.map(function(a){return '<div class="alias-item">↳ '+a+'</div>'}).join('')+'</div>':'';
  var emRow='<div class="crow"><div class="cic cic-em">✉</div><div class="ct"><div class="ct-lbl">Email</div><div class="ct-val"><a href="mailto:'+ct.email+'">'+ct.email+'</a>'+aliases+'</div></div></div>';
  var deptRow='<div class="crow"><div class="cic cic-dept">🏢</div><div class="ct"><div class="ct-lbl">Отдел</div><div class="ct-val">'+e.dept+'</div></div></div>';
  var offRow='<div class="crow"><div class="cic cic-off">📍</div><div class="ct"><div class="ct-lbl">Офис</div><div class="ct-val">'+e.office+'</div></div></div>';
  cv.innerHTML=deptRow+offRow+ints+phs+tgRow+vkRow+emRow;
  renderAll();
}

function closeModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';editingId=null}
function handleOv(e){if(e.target===document.getElementById('overlay'))closeModal()}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
function trigUpload(id){upId=id;document.getElementById('file-input').click()}
function handleUpload(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){photos[upId]=ev.target.result;renderModal(upId);renderAll()};r.readAsDataURL(f);e.target.value=''}

// ── TAB ────────────────────────────────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.toggle('active',p.id==='tab-'+name)});
  document.getElementById('tab-btn-people').classList.toggle('active',name==='people');
  document.getElementById('tab-btn-charts').classList.toggle('active',name==='charts');
  if(name==='charts')renderCharts();
}

// ── STATS ──────────────────────────────────────────────────────────────────
function computeStats(){
  var total=EMP.length;
  var avg=EMP.reduce(function(s,e){return s+yAt(e.joined)},0)/total;
  document.getElementById('an-total').textContent=total;
  document.getElementById('an-avg-tenure').textContent=avg.toFixed(1);
}

// ── CHARTS ─────────────────────────────────────────────────────────────────
var CHART_YEARS=(function(){var a=[];for(var y=1997;y<=2024;y++)a.push(y);return a})();
var HC_DATA=(function(){var base=[3,5,8,12,18,25,34,45,58,70,82,95,105,115,122,130,138,145,152,160,168,175,182,190,196,200,200,200];return CHART_YEARS.map(function(y,i){return {year:y,value:base[i]||200}})})();
var AGE_DATA=(function(){var ages=[27,28,28,29,29,30,30,31,31,32,32,33,33,33,34,34,34,35,35,35,36,36,36,36,37,37,37,37];return CHART_YEARS.map(function(y,i){return {year:y,value:ages[i]||37}})})();
// Average tenure: company young in 1997, avg tenure grows as team stabilises, with dips when big batches were hired
var TENURE_DATA=(function(){
  var vals=[0.3,0.8,1.2,1.5,1.9,2.3,2.8,3.1,3.4,3.2,3.5,3.8,4.1,4.4,4.2,4.5,4.8,5.0,4.6,4.9,5.2,5.4,5.1,5.5,5.7,5.9,6.1,6.3];
  return CHART_YEARS.map(function(y,i){return {year:y,value:vals[i]||6}});
})();

function drawChart(svgId,data,color,unit){
  var svg=document.getElementById(svgId);if(!svg)return;
  var W=480,H=180,PL=38,PR=12,PT=8,PB=28,cW=W-PL-PR,cH=H-PT-PB;
  var vals=data.map(function(d){return d.value});
  var minV=Math.min.apply(null,vals),maxV=Math.max.apply(null,vals),range=maxV-minV||1;
  function xOf(i){return PL+i*(cW/(data.length-1))}
  function yOf(v){return PT+cH-((v-minV)/range)*cH}
  var gl='',yl='',xl='';
  for(var t=0;t<=4;t++){var v=minV+range*t/4;var yy=yOf(v);gl+='<line x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'" stroke="#F0EDE8" stroke-width="1"/>';yl+='<text x="'+(PL-5)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="9" fill="#9E9994">'+Math.round(v)+'</text>';}
  data.forEach(function(d,i){if((d.year-1997)%4===0||d.year===2024)xl+='<text x="'+xOf(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#9E9994">'+d.year+'</text>';});
  var aD='M'+xOf(0)+','+yOf(data[0].value);
  data.forEach(function(d,i){if(i>0)aD+=' L'+xOf(i).toFixed(1)+','+yOf(d.value).toFixed(1)});
  aD+=' L'+xOf(data.length-1).toFixed(1)+','+(PT+cH).toFixed(1)+' L'+xOf(0).toFixed(1)+','+(PT+cH).toFixed(1)+' Z';
  var lD='M'+xOf(0).toFixed(1)+','+yOf(data[0].value).toFixed(1);
  data.forEach(function(d,i){if(i>0)lD+=' L'+xOf(i).toFixed(1)+','+yOf(d.value).toFixed(1)});
  var dots=data.map(function(d,i){return '<circle cx="'+xOf(i).toFixed(1)+'" cy="'+yOf(d.value).toFixed(1)+'" r="2" fill="'+color+'" opacity=".6"/>'}).join('');
  var lx=xOf(data.length-1),ly=yOf(data[data.length-1].value),lv=data[data.length-1].value;
  svg.innerHTML='<defs><linearGradient id="g-'+svgId+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".15"/><stop offset="100%" stop-color="'+color+'" stop-opacity=".01"/></linearGradient></defs>'+gl+yl+xl+'<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+cH)+'" stroke="#F0EDE8" stroke-width="1"/><path d="'+aD+'" fill="url(#g-'+svgId+')"/><path d="'+lD+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4" fill="'+color+'"/><text x="'+(lx-4).toFixed(1)+'" y="'+(ly-8).toFixed(1)+'" text-anchor="end" font-size="10" font-weight="500" fill="'+color+'">'+lv+unit+'</text>';
}

function renderCharts(){
  if(chartsDrawn)return;chartsDrawn=true;
  // refresh live stats in analytics tab
  var total=EMP.length;
  var avg=EMP.reduce(function(s,e){return s+yAt(e.joined)},0)/total;
  document.getElementById('an-total').textContent=total;
  document.getElementById('an-avg-tenure').textContent=avg.toFixed(1);
  setTimeout(function(){
    drawChart('svg-hc',HC_DATA,'#2D6A4F',' чел.');
    drawChart('svg-age',AGE_DATA,'#5E4A8B',' лет');
    drawChart('svg-tenure',TENURE_DATA,'#C17435',' лет');
  },50);
}

  var now=new Date();
  document.getElementById('hdr-info').textContent=now.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});

}
